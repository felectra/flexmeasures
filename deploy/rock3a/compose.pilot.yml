# ------------------------------------------------------------------
# FlexMeasures — pilot stack for a Radxa ROCK 3A (aarch64), rootless Podman.
# Production configuration with forced HTTPS turned off
# (FLEXMEASURES_FORCE_HTTPS=False) for an internal-only pilot reached over
# Tailscale. Debugging and request profiling are off (unlike development mode).
# The arm64 image is built on a separate arm64 host and loaded on the board —
# see README (the board's 14.5 GB eMMC is too small to build it in place).
#
# Usage (on the board, from THIS directory, deploy/rock3a/):
#   podman-compose --env-file .env -f compose.pilot.yml up -d
#
# Secrets, TRUSTED_HOSTS and the bind address all come from ./.env
# (copy it from .env.example and fill in real, generated values).
# ------------------------------------------------------------------

services:
  db:
    image: docker.io/library/postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - fm-db-data:/var/lib/postgresql/data
      - ../../ci/load-psql-extensions.sql:/docker-entrypoint-initdb.d/load-psql-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    image: docker.io/library/redis:7.4.11
    restart: unless-stopped
    command: redis-server --loglevel warning --requirepass ${FLEXMEASURES_REDIS_PASSWORD}
    volumes:
      - fm-redis-data:/data

  mailpit:
    # Test mail server — Mailpit, the arm64-native successor to MailHog (mailhog/mailhog is
    # published for amd64 only). Captured mail is read in the web UI, nothing leaves the board.
    # Mailpit defaults: SMTP on :1025, web UI on :8025.
    image: docker.io/axllent/mailpit:v1.31.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:8025:8025"   # web UI, bound to the given interface only (not 0.0.0.0)

  server:
    # Built off-board and loaded via podman save|load — see README.
    image: localhost/flexmeasures-pilot:local
    restart: unless-stopped
    depends_on:
      - db
      - queue
      - mailpit
    ports:
      - "${BIND_ADDR}:5000:5000"   # bound to the given interface only (not 0.0.0.0)
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_TOTP_SECRETS: ${SECURITY_TOTP_SECRETS}
      FLEXMEASURES_ENV: production
      FLEXMEASURES_FORCE_HTTPS: "False"
      FLEXMEASURES_TIMEZONE: Europe/Kyiv
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}
      FLEXMEASURES_REDIS_URL: queue
      FLEXMEASURES_REDIS_PASSWORD: ${FLEXMEASURES_REDIS_PASSWORD}
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      LOGGING_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v3_0/health/ready"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 6
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      set -e
      until python -c "import socket; socket.create_connection(('db', 5432), 3)" 2>/dev/null; do
        echo "waiting for the database to accept connections..."; sleep 3;
      done
      flexmeasures db upgrade
      exec gunicorn --bind 0.0.0.0:5000 --worker-tmp-dir /dev/shm --workers 2 --threads 4 wsgi:application

  worker:
    image: localhost/flexmeasures-pilot:local
    restart: unless-stopped
    depends_on:
      - db
      - queue
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_TOTP_SECRETS: ${SECURITY_TOTP_SECRETS}
      FLEXMEASURES_ENV: production
      FLEXMEASURES_FORCE_HTTPS: "False"
      FLEXMEASURES_TIMEZONE: Europe/Kyiv
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}
      FLEXMEASURES_REDIS_URL: queue
      FLEXMEASURES_REDIS_PASSWORD: ${FLEXMEASURES_REDIS_PASSWORD}
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      LOGGING_LEVEL: INFO
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      set -e
      until python -c "import socket; [socket.create_connection((h, p), 3) for h, p in (('db', 5432), ('queue', 6379))]" 2>/dev/null; do
        echo "waiting for the database and the queue to be reachable..."; sleep 3;
      done
      exec flexmeasures jobs run-worker --name rock3a-worker --queue "forecasting|scheduling|ingestion"

volumes:
  # Explicit names so the volumes are not prefixed with the compose project name
  # (keeps backup/restore commands stable regardless of the working directory).
  fm-db-data:
    name: fm-db-data
  fm-redis-data:
    name: fm-redis-data
